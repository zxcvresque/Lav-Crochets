<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Image gallery · Component · JoyWaveDigital mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../screens-mobile/mobile.css" />
<style>
  body { background: var(--bg-subtle) }
  .mob-stage { background: var(--bg); min-height: auto; padding-bottom: 24px; margin: 24px auto; box-shadow: 0 16px 48px -24px oklch(0.18 0.05 40 / 0.32); border-radius: 12px; overflow: hidden }
  .ann { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); padding: 12px 16px 4px; background: var(--bg) }
  .ann strong { color: var(--fg); font-weight: 600 }
</style>
</head>
<body>
<div style="font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); text-align: center; padding: 18px 0 0">Image gallery · /products/[slug]</div>


<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="2"></div>
  <div class="ann"><strong>Default (image 1 of 4)</strong></div>
  
<section class="mob-gallery placeholder">
  <span class="placeholder-img" style="position:absolute; inset: 24%; border-radius: 8px; background: var(--bg); border: 1px dashed var(--line-2)">[ product 1 of 4 ]</span>
  <button class="mob-gallery-zoom" aria-label="Zoom image"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button>
  <button class="mob-gallery-share" aria-label="Share product"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg></button>
  <div class="mob-gallery-dots">
    <span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
</section>

  <div data-chrome="home"></div>
</div>
<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="2"></div>
  <div class="ann"><strong>Mid swipe (between 1 and 2)</strong></div>
  
<section class="mob-gallery placeholder">
  <span class="placeholder-img" style="position:absolute; top: 24%; bottom: 24%; left: -32%; right: 56%; border-radius: 8px; background: var(--bg); border: 1px dashed var(--line-2)">[ 1 ]</span>
  <span class="placeholder-img" style="position:absolute; top: 24%; bottom: 24%; left: 56%; right: -32%; border-radius: 8px; background: var(--bg); border: 1px dashed var(--line-2)">[ 2 ]</span>
  <div class="mob-gallery-dots">
    <span class="dot on" style="width: 18px"></span><span class="dot" style="width: 10px; background: oklch(0.92 0.005 70)"></span><span class="dot"></span><span class="dot"></span>
  </div>
</section>

  <div data-chrome="home"></div>
</div>
<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="2"></div>
  <div class="ann"><strong>Zoomed</strong></div>
  
<section class="mob-gallery placeholder" style="background: oklch(0.165 0.025 50)">
  <span class="placeholder-img" style="position:absolute; inset: -16%; border-radius: 0; background: var(--bg); transform: scale(1.6); transform-origin: center; opacity: 0.95">[ zoomed 1.6x ]</span>
  <button class="mob-gallery-share" aria-label="Close zoom" style="left: 12px; right: auto"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</section>

  <div data-chrome="home"></div>
</div><script src="../screens-mobile/_mobile-chrome.js"></script>
</body>
</html>
