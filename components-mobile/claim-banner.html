<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ClaimBanner · Component · JoyWaveDigital mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../screens-mobile/mobile.css" />
<style>
  body { background: var(--bg-subtle) }
  .mob-stage { background: var(--bg); min-height: auto; padding-bottom: 24px; margin: 24px auto; box-shadow: 0 16px 48px -24px oklch(0.18 0.05 40 / 0.32); border-radius: 12px; overflow: hidden }
  .ann { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); padding: 12px 16px 4px; background: var(--bg) }
  .ann strong { color: var(--fg); font-weight: 600 }
</style>
</head>
<body>
<div style="font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); text-align: center; padding: 18px 0 0">ClaimBanner · /account/library</div>


<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="2"></div>
  <div class="ann"><strong>Default (CTA stacked)</strong></div>
  
<main class="mob-main">
  <div class="mob-banner brand" role="region" style="margin: 12px 0; flex-direction: column; gap: 12px; align-items: stretch; padding: 14px 16px; position: relative">
    <button aria-label="Dismiss" style="position:absolute; right:8px; top:8px; width:32px; height:32px; background:transparent; border:0; color:var(--joy-700)"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div style="padding-right:28px">
      <strong style="font-family: var(--font-display); font-weight: 600; font-size: 16px">A past order matches this email.</strong>
      <p style="margin: 4px 0 0; font-size: var(--t-sm); line-height: 1.45; color: var(--joy-950)">2 files from order #JWD-28109 (Mar 14). Add them to your library, or mark not-mine.</p>
    </div>
    <div style="display:flex; gap:8px">
      <button class="mob-btn primary" style="flex:1; height:44px; font-size: var(--t-sm)">Add to library</button>
      <button class="mob-btn ghost" style="height:44px; font-size: var(--t-sm); border-color: var(--joy-700); color: var(--joy-950); padding: 0 14px">Not mine</button>
    </div>
  </div>
</main>

  <div data-chrome="home"></div>
</div>
<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="2"></div>
  <div class="ann"><strong>Loading (after Add tap)</strong></div>
  
<main class="mob-main">
  <div class="mob-banner brand" role="region" aria-busy="true" style="margin: 12px 0; flex-direction: column; gap: 12px; align-items: stretch; padding: 14px 16px">
    <div>
      <strong style="font-family: var(--font-display); font-weight: 600; font-size: 16px">Adding 2 files to your library…</strong>
    </div>
    <div style="display:flex; gap:8px">
      <button class="mob-btn primary" style="flex:1; height:44px; font-size: var(--t-sm); opacity: 0.85" disabled>
        <span class="mob-skel" style="display:inline-block; width: 16px; height: 16px; border-radius: 99px; margin-right: 8px"></span>
        Working…
      </button>
    </div>
  </div>
</main>

  <div data-chrome="home"></div>
</div><script src="../screens-mobile/_mobile-chrome.js"></script>
</body>
</html>
