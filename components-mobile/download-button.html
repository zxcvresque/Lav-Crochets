<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DownloadButton · Component · JoyWaveDigital mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../screens-mobile/mobile.css" />
<style>
  body { background: var(--bg-subtle) }
  .mob-stage { background: var(--bg); min-height: auto; padding-bottom: 24px; margin: 24px auto; box-shadow: 0 16px 48px -24px oklch(0.18 0.05 40 / 0.32); border-radius: 12px; overflow: hidden }
  .ann { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); padding: 12px 16px 4px; background: var(--bg) }
  .ann strong { color: var(--fg); font-weight: 600 }
</style>
</head>
<body>
<div style="font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); text-align: center; padding: 18px 0 0">DownloadButton · states</div>
<div class="mob-stage" style="padding: 24px 16px">
  <div class="mob-eyebrow" style="margin-bottom: 8px">Default · 48 to 56pt</div>
  <button class="mob-btn ink full" style="height: 56px; margin-bottom: 18px">
    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg>
    Download PDF
  </button>

  <div class="mob-eyebrow" style="margin-bottom: 8px">Loading</div>
  <button class="mob-btn ink full" style="height: 56px; margin-bottom: 18px; opacity: 0.85" disabled>
    <span class="mob-skel" style="display: inline-block; width: 18px; height: 18px; border-radius: 99px; background: oklch(0.6 0.005 70)"></span>
    Preparing download…
  </button>

  <div class="mob-eyebrow" style="margin-bottom: 8px">Re-download (library)</div>
  <button class="mob-btn ink" style="height: 44px; padding: 0 14px; font-size: var(--t-sm); margin-bottom: 18px">
    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg>
    Re-download
  </button>

  <div class="mob-eyebrow" style="margin-bottom: 8px">412 refusal · refund-detected</div>
  <div class="mob-banner bad" style="margin-bottom: 8px">
    <svg class="icon" style="flex-shrink: 0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>
    <div>
      <strong>This order is no longer downloadable.</strong>
      <span style="display: block; margin-top: 4px; font-size: var(--t-sm)">The order was refunded between page-load and tap. Check your library for live status.</span>
    </div>
  </div>
  <a href="../screens-mobile/account-library.html" class="mob-btn ghost full">Open library</a>
</div>
<script src="../screens-mobile/_mobile-chrome.js"></script>
</body>
</html>
