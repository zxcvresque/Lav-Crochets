<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PriceChangedBanner · Component · JoyWaveDigital mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../screens-mobile/mobile.css" />
<style>
  body { background: var(--bg-subtle) }
  .mob-stage { background: var(--bg); min-height: auto; padding-bottom: 24px; margin: 24px auto; box-shadow: 0 16px 48px -24px oklch(0.18 0.05 40 / 0.32); border-radius: 12px; overflow: hidden }
  .ann { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); padding: 12px 16px 4px; background: var(--bg) }
  .ann strong { color: var(--fg); font-weight: 600 }
</style>
</head>
<body>
<div style="font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); text-align: center; padding: 18px 0 0">PriceChangedBanner · top of /cart on 409</div>


<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="2"></div>
  <div class="ann"><strong>Default</strong></div>
  
<main class="mob-main">
  <h1 style="font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: -0.025em; margin: 8px 0 12px">Cart</h1>
  <div class="mob-banner warn" role="alert" style="margin-bottom: 18px">
    <svg class="icon" style="flex-shrink: 0; margin-top: 1px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 9v4M12 17h.01M3 19h18L12 3 3 19z"/></svg>
    <div><strong>Prices updated.</strong> Review and try again. One item was on sale; the sale ended before checkout.</div>
  </div>
  <p class="mob-eyebrow" style="margin: 0 0 12px">Affected items</p>
  <div class="mob-cart-line">
    <div class="thumb placeholder"></div>
    <div>
      <h3>Number-line math, 1 to 100</h3>
      <div class="meta">PDF + PNG</div>
      <div class="row" style="margin-top: 6px">
        <div class="price"><span style="color: var(--fg)">$8.00</span> <small style="color: var(--fg-faint); text-decoration: line-through">was $5.10</small></div>
        <button class="remove" aria-label="Remove"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </div>
  </div>
</main>

  <div data-chrome="home"></div>
</div><script src="../screens-mobile/_mobile-chrome.js"></script>
</body>
</html>
