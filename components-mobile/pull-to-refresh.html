<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pull-to-refresh · Component · JoyWaveDigital mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../screens-mobile/mobile.css" />
<style>
  body { background: var(--bg-subtle) }
  .mob-stage { background: var(--bg); min-height: auto; padding-bottom: 24px; margin: 24px auto; box-shadow: 0 16px 48px -24px oklch(0.18 0.05 40 / 0.32); border-radius: 12px; overflow: hidden }
  .ann { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); padding: 12px 16px 4px; background: var(--bg) }
  .ann strong { color: var(--fg); font-weight: 600 }
</style>
</head>
<body>
<div style="font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); text-align: center; padding: 18px 0 0">Pull-to-refresh · 4 phases</div>


<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="2"></div>
  <div class="ann"><strong>Idle (at scrollTop 0)</strong></div>
  
<main class="mob-main">
  <div class="mob-ptr">↓ Pull to refresh</div>
  <h1 style="font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: -0.025em; margin: 0 0 12px">Your library</h1>
  <p class="mob-eyebrow">12 files</p>
</main>

  <div data-chrome="home"></div>
</div>

<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="2"></div>
  <div class="ann"><strong>Pulling (below threshold)</strong></div>
  
<main class="mob-main" style="transform: translateY(40px)">
  <div class="mob-ptr" style="color: var(--fg-soft); transform: translateY(-56px)">
    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    Pull to refresh
  </div>
  <h1 style="font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: -0.025em; margin: 0 0 12px">Your library</h1>
</main>

  <div data-chrome="home"></div>
</div>

<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="2"></div>
  <div class="ann"><strong>Armed (release-to-refresh)</strong></div>
  
<main class="mob-main" style="transform: translateY(76px)">
  <div class="mob-ptr" style="color: var(--joy-700); transform: translateY(-90px) scale(1.05)">
    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12l-7 7-7-7"/></svg>
    Release to refresh
  </div>
  <h1 style="font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: -0.025em; margin: 0 0 12px">Your library</h1>
</main>

  <div data-chrome="home"></div>
</div>

<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="2"></div>
  <div class="ann"><strong>Refreshing (held at 64)</strong></div>
  
<main class="mob-main" style="transform: translateY(64px)">
  <div class="mob-ptr" style="color: var(--joy-700); transform: translateY(-80px)">
    <span class="mob-skel" style="width: 16px; height: 16px; border-radius: 99px"></span>
    Refreshing…
  </div>
  <h1 style="font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: -0.025em; margin: 0 0 12px">Your library</h1>
</main>

  <div data-chrome="home"></div>
</div>
<script src="../screens-mobile/_mobile-chrome.js"></script>
</body>
</html>
