<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Recover a receipt · JoyWaveDigital mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="mobile.css" />
</head>
<body>
<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="0"></div>

  <main class="mob-main" id="main">
    <div class="mob-eyebrow" style="margin-top: 8px"><span class="mob-eyebrow-dot"></span>Receipts &amp; downloads</div>
    <h1 style="font-family: var(--font-display); font-weight: 600; font-size: clamp(36px, 10vw, 48px); letter-spacing: -0.03em; line-height: 1.0; margin: 14px 0 12px; text-wrap: balance">Find a past order.</h1>
    <p style="margin: 0 0 26px; color: var(--fg-soft); font-size: var(--t-md); line-height: 1.5">Enter the email you used at checkout. We will send a link to your past orders and downloads.</p>

    <form style="display: flex; flex-direction: column; gap: 14px" novalidate>
      <label for="recover-email" class="mob-eyebrow" style="margin-bottom: -4px">Receipt email</label>
      <input id="recover-email" type="email" inputmode="email" autocomplete="email" enterkeyhint="send" autofocus placeholder="you@example.com" style="height: 56px; padding: 0 18px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 14px; font-size: 17px" />
      <p style="margin: 0 0 8px; color: var(--fg-muted); font-size: var(--t-sm)">If we have any orders for that address, you will get a one-tap link within a minute.</p>
    </form>

    <div style="height: 80px"></div>
  </main>

  <div class="mob-sticky-cta">
    <button type="submit" form="recover-form" class="mob-btn primary full">Send my receipts</button>
  </div>

  <div data-chrome="home"></div>
</div>
<script src="_mobile-chrome.js"></script>
</body>
</html>
