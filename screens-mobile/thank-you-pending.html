<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Thank you · Pending · JoyWaveDigital mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="mobile.css" />
<style>
  @keyframes spin { from { transform: rotate(0) } to { transform: rotate(360deg) } }
  .spinner {
    width: 56px; height: 56px;
    border-radius: 99px;
    border: 3px solid var(--bg-subtle);
    border-top-color: var(--joy-500);
    animation: spin 1.1s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--bg-subtle) }
    .spinner::after { content: "·"; }
  }
</style>
</head>
<body>
<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="0"></div>

  <main class="mob-main" id="main" style="display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 70vh; padding-top: 60px">
    <div class="spinner" role="status" aria-label="Processing payment"></div>
    <span class="mob-status pending" style="margin-top: 18px">Processing</span>
    <h1 style="font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 8vw, 40px); letter-spacing: -0.025em; line-height: 1.05; margin: 16px 0 10px; text-wrap: balance">Hang on, we are confirming your payment.</h1>
    <p style="margin: 0 0 24px; color: var(--fg-soft); font-size: var(--t-md); line-height: 1.5; max-width: 38ch">Most payments confirm in 5 to 30 seconds. We will email your downloads either way.</p>
    <p class="mob-eyebrow" style="margin: 0 0 24px">Order #JWD-29482</p>
    <p style="margin: 0; color: var(--fg-muted); font-size: var(--t-sm); max-width: 36ch">You can close this page. Your receipt will arrive at <strong style="color: var(--fg)">sneha@example.com</strong> when payment clears.</p>

    <div style="margin-top: auto; padding-top: 32px; width: 100%">
      <a href="orders-recover.html" class="mob-btn ghost full">Email me my receipt instead</a>
    </div>
  </main>

  <div data-chrome="home"></div>
</div>
<script src="_mobile-chrome.js"></script>
</body>
</html>
