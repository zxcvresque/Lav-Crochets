<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Admin · JoyWaveDigital mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="mobile.css" />
</head>
<body>
<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="0"></div>

  <main class="mob-main" id="main">
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 48px">
      <div style="width: 80px; height: 80px; border-radius: 99px; background: var(--bg-subtle); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 18px">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--fg-muted)" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M12 18v3M9 21h6"/></svg>
      </div>
      <h1 style="font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 8vw, 36px); letter-spacing: -0.025em; line-height: 1.05; margin: 0 0 12px; text-wrap: balance">Admin works best on desktop.</h1>
      <p style="margin: 0 0 32px; color: var(--fg-soft); font-size: var(--t-md); line-height: 1.5; max-width: 32ch">The tables, charts, and bulk-edit flows need real estate to be usable. Open a laptop.</p>
      <a href="shop.html" class="mob-btn primary full" style="margin-bottom: 10px">Go to shop</a>
      <button class="mob-btn ghost full">Sign out</button>
    </div>
  </main>

  <div data-chrome="home"></div>
</div>
<script src="_mobile-chrome.js"></script>
</body>
</html>
