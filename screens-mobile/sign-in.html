<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in · JoyWaveDigital mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="mobile.css" />
</head>
<body>
<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="0"></div>

  <main class="mob-main" id="main">
    <div style="display:flex; flex-direction: column; align-items: center; padding-top: 32px; text-align: center">
      <svg width="44" height="44" viewBox="0 0 28 28" aria-hidden="true">
        <rect width="28" height="28" rx="9" fill="var(--joy-500)"/>
        <path d="M3 16 C 7 8, 9 24, 13 16 S 19 8, 21 16 S 25 24, 27 16" stroke="var(--joy-950)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <circle cx="14" cy="7" r="2" fill="var(--joy-950)"/>
      </svg>
      <h1 style="font-family: var(--font-display); font-weight: 600; font-size: clamp(34px, 10vw, 44px); letter-spacing: -0.03em; line-height: 1.0; margin: 18px 0 10px; text-wrap: balance">Sign in.</h1>
      <p style="margin: 0 0 32px; color: var(--fg-soft); font-size: var(--t-md); line-height: 1.5; max-width: 36ch">No password. We email you a one-tap link to sign in.</p>
    </div>

    <form id="signin-form" novalidate style="display: flex; flex-direction: column; gap: 14px">
      <label for="signin-email" class="mob-eyebrow" style="margin-bottom: -4px">Email</label>
      <input id="signin-email" type="email" inputmode="email" autocomplete="email" enterkeyhint="go" autofocus placeholder="you@example.com" style="height: 56px; padding: 0 18px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 14px; font-size: 17px" />
    </form>

    <p style="margin: 22px 0 8px; color: var(--fg-muted); font-size: var(--t-sm); text-align: center">
      No account? It will be created the first time you sign in.
    </p>

    <div style="height: 80px"></div>
  </main>

  <div class="mob-sticky-cta">
    <button type="submit" form="signin-form" class="mob-btn primary full">Send sign-in link</button>
  </div>

  <div data-chrome="home"></div>
</div>
<script src="_mobile-chrome.js"></script>
</body>
</html>
