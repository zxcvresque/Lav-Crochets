<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Contact · JoyWaveDigital mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="mobile.css" />
<style>
  .fld { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px }
  .fld label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted) }
  .fld input, .fld textarea, .fld select { padding: 14px 16px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 12px; font-size: 16px; font-family: inherit; color: var(--fg); width: 100% }
  .fld input, .fld select { height: 48px; padding: 0 16px }
  .fld textarea { min-height: 132px; resize: vertical; line-height: 1.5 }
</style>
</head>
<body>
<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="0"></div>

  <main class="mob-main" id="main">
    <div class="mob-eyebrow" style="margin-top: 8px"><span class="mob-eyebrow-dot"></span>One inbox, one person</div>
    <h1 class="mob-h1" style="margin-top: 12px">Email the maker.</h1>
    <p class="mob-sub">I usually reply within a working day. Faster if it is an order issue.</p>

    <form>
      <div class="fld">
        <label for="c_name">Your name</label>
        <input id="c_name" type="text" inputmode="text" autocomplete="name" enterkeyhint="next" placeholder="What should I call you?" />
      </div>
      <div class="fld">
        <label for="c_email">Email</label>
        <input id="c_email" type="email" inputmode="email" autocomplete="email" enterkeyhint="next" placeholder="you@example.com" />
      </div>
      <div class="fld">
        <label for="c_subject">Subject</label>
        <select id="c_subject" enterkeyhint="next">
          <option>An order issue</option>
          <option>A download is broken</option>
          <option>Refund request</option>
          <option>Licensing or schools</option>
          <option>Press / brand collab</option>
          <option>Just saying hi</option>
        </select>
      </div>
      <div class="fld">
        <label for="c_msg">Message</label>
        <textarea id="c_msg" inputmode="text" enterkeyhint="send" placeholder="Order number helps if this is about a receipt."></textarea>
      </div>

      <button type="submit" class="mob-btn primary full">Send message</button>
    </form>

    <div class="mob-card" style="margin-top: 24px">
      <h3 style="margin: 0 0 6px; font-family: var(--font-display); font-weight: 600; font-size: 16px">Faster channels for these</h3>
      <ul style="margin: 0; padding-left: 18px; color: var(--fg-soft); font-size: var(--t-sm); line-height: 1.6">
        <li>Receipt missing: <a href="orders-recover.html" style="text-decoration: underline">recover here</a></li>
        <li>Download error: include the order number</li>
        <li>Refund: please tell me what to fix first</li>
      </ul>
    </div>
  </main>

  <div data-chrome="home"></div>
</div>
<script src="_mobile-chrome.js"></script>
</body>
</html>
