<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wishlist · JoyWaveDigital mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="mobile.css" />
</head>
<body>
<div class="mob-stage" data-stage data-no-announce>
  <div data-chrome="status"></div>
  <div data-chrome="header" data-cart-count="0" data-signed-in></div>

  <nav class="mob-acct-nav" aria-label="Account sections">
    <a href="account-library.html">Library</a>
    <a href="account-orders.html">Orders</a>
    <a href="account-wishlist.html" class="active">Wishlist</a>
    <a href="account-profile.html">Profile</a>
    <a href="account-settings.html">Settings</a>
  </nav>

  <main class="mob-main" id="main">
    <h1 style="font-family: var(--font-display); font-weight: 600; font-size: clamp(34px, 9vw, 44px); letter-spacing: -0.03em; margin: 8px 0 4px">Wishlist</h1>
    <p class="mob-eyebrow" style="margin: 0 0 20px">5 items saved</p>

    <div class="mob-grid">
      <article class="mob-pcard">
        <div class="mob-pcard-img placeholder">
          <span class="chip sale">36% off</span>
          <button class="mob-pcard-heart on" aria-label="Remove from wishlist"><svg class="icon-sm" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg></button>
          <a href="product-detail.html" class="cover"></a>
        </div>
        <h3 title="Number-line math, 1 to 100">Number-line math, 1 to 100</h3>
        <div class="meta">PDF · 18 pages</div>
        <div class="price"><span class="save">$5.10</span> <span class="strike">$8.00</span></div>
      </article>
      <article class="mob-pcard">
        <div class="mob-pcard-img placeholder">
          <button class="mob-pcard-heart on" aria-label="Remove from wishlist"><svg class="icon-sm" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg></button>
          <a href="product-detail.html" class="cover"></a>
        </div>
        <h3 title="Decodable readers, Set 4, long vowels">Decodable readers, Set 4</h3>
        <div class="meta">PDF · 24 pages</div>
        <div class="price">$8.00</div>
      </article>
      <article class="mob-pcard">
        <div class="mob-pcard-img placeholder">
          <span class="chip pick">Pick</span>
          <button class="mob-pcard-heart on" aria-label="Remove from wishlist"><svg class="icon-sm" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg></button>
          <a href="product-detail.html" class="cover"></a>
        </div>
        <h3 title="Classroom decor bundle, calm-neutrals">Classroom decor bundle</h3>
        <div class="meta">PDF + PNG · 64 pages</div>
        <div class="price">$18.00</div>
      </article>
      <article class="mob-pcard">
        <div class="mob-pcard-img placeholder">
          <button class="mob-pcard-heart on" aria-label="Remove from wishlist"><svg class="icon-sm" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg></button>
          <a href="product-detail.html" class="cover"></a>
        </div>
        <h3 title="Counting flashcards, 1 to 20">Counting flashcards, 1 to 20</h3>
        <div class="meta">PDF · 40 cards</div>
        <div class="price">$5.00</div>
      </article>
    </div>
  </main>

  <div data-chrome="home"></div>
</div>
<script src="_mobile-chrome.js"></script>
</body>
</html>
